[package]
name = "gpui-android"
version = "0.9.3"
edition = "2024"
description = "Android platform backend for GPUI (vendored into gpui_learn, pinned to zed 82aef443)"
license = "Apache-2.0"
publish = false

[lib]
crate-type = ["rlib"]

[features]
default = []
autoeq = []
camera = []
deeplink = []
gpu-2d = []
gpu-3d = []
media_session = []
reqwest = []
showcase = []
spinorama = []
tokio = []
urlencoding = []

# GPUI 依赖统一指向本仓库根 [patch.crates-io] 的 zed 82aef443（与 01/02 同源）。
# 注意：本仓库根已把 gpui / gpui_wgpu patch 到该 rev，这里用相同的 git 源即可。
[dependencies]
accesskit = "0.24.0"
anyhow = "1.0"
futures = "0.3"
gpui = { git = "https://github.com/zed-industries/zed", rev = "82aef44308540b576e4e51fb379efa71614e5c91", version = "=0.2.2", default-features = false }
gpui_wgpu = { git = "https://github.com/zed-industries/zed", rev = "82aef44308540b576e4e51fb379efa71614e5c91", version = "=0.1.0" }
log = { version = "0.4", features = ["kv_unstable_serde", "serde"] }
parking_lot = "0.12"
raw-window-handle = "0.6"
smallvec = { version = "1.6", features = ["union", "const_new"] }
serde_json = "1"

[target.'cfg(target_os = "android")'.dependencies]
android-activity = { version = "0.6", features = ["native-activity"] }
android_logger = "0.15"
jni = "0.22"
libc = "0.2"
ndk = { version = "0.9", features = ["nativewindow"] }
ndk-context = "0.1"
ndk-sys = "0.6"
rustc-hash = "2"
uuid = { version = "1", features = ["v5"] }
