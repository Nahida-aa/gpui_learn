[package]
name = "gpui_learn_common"
# 下面这些字段都来自工作区根 [workspace.package]，用 .workspace = true 继承。
# 这是 monorepo 的常见做法：版本/edition/license 只在根里维护一份。
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

# 这是一个「库项目（library crate）」：它没有 main 函数，只提供可被其它包
# 复用的代码。对应地，apps/* 是「二进制项目（binary crate）」，有 main 函数、
# 能直接运行。一个 monorepo 通常由「若干库 + 若干二进制」组成，库被二进制依赖。
[lib]
path = "src/lib.rs"

[dependencies]
# 用 workspace = true 引用根 Cargo.toml [workspace.dependencies] 里统一定义的 gpui。
# 注意 default-features = false：gpui 默认会开 wayland/x11/font-kit，我们在下面
# 用「特性（features）」按平台手动开启，这样库的使用者（apps）不用关心细节。
gpui = { workspace = true }
gpui_macros = { workspace = true }
# gpui_platform 提供平台入口 application()，是启动一个 GPUI 程序必须的。
gpui_platform = { workspace = true }
