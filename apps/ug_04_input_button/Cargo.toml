[package]
name = "ug_04_input_button"
version.workspace = true
edition.workspace = true
license = "Apache-2.0"
publish = false
description = "ug_04_input_button —— 自研 aa_ui_zed 的 Input 与 Button 演示（输入 / IME / 选区 / 事件）"

[dependencies]
gpui = { workspace = true }
aa_ui_zed.workspace = true
# 输入 facade（InputState / InputEvent / bind_input_keys）2026-09 搬进 editor 包，
# 依赖方向翻转成了 editor → aa_gpui_kit_ui_input → aa_ui_zed。
editor.workspace = true

# 桌面窗口后端需要显式开启，否则 open_window 不出窗口。
[target.'cfg(any(target_os = "linux", target_os = "freebsd"))'.dependencies]
gpui_platform = { workspace = true, features = ["font-kit", "wayland", "x11"] }

[target.'cfg(not(any(target_os = "linux", target_os = "freebsd", target_family = "wasm")))'.dependencies]
gpui_platform = { workspace = true }
