[package]
name = "testing_08"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
# 包名沿用 08_testing 目录语义；运行：`cargo run -p testing_08`。
#
# 工程结构与 07 一致：桌面走 bin（main.rs → run()），Android 走 cdylib .so
# （NativeActivity 加载）。lib 同时产 cdylib（给 Android）和 rlib（给桌面 bin
# 链接；bin 不能和 cdylib 同名混用，但 rlib 可以）。
[lib]
name = "testing_08"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "testing_08"
path = "src/main.rs"

[dependencies]
gpui = { workspace = true }
# 桌面 / 通用依赖：log 给诊断日志用（env_logger 在 run() 里初始化后输出）。
log = "0.4"
# 桌面端 logger backend（初始化后 log::info! 才能在终端输出；不初始化则静默丢弃）。
env_logger = "0.11"

# gpui_platform 提供桌面入口 application()，按平台开窗口后端。
[target.'cfg(any(target_os = "linux", target_os = "freebsd"))'.dependencies]
gpui_platform = { workspace = true, features = ["font-kit", "wayland", "x11"] }

[target.'cfg(not(any(target_os = "linux", target_os = "freebsd", target_os = "android", target_family = "wasm")))'.dependencies]
gpui_platform = { workspace = true }

[target.'cfg(target_family = "wasm")'.dependencies]
gpui_platform = { workspace = true }
wasm-bindgen = "0.2.120"

# 08 是「GPUI 测试框架」示例：文件末尾 `#[cfg(test)]` 模块演示 #[gpui::test]。
# 运行测试需开启 test-support 特性，并提供 rand / futures 这两个测试依赖
#（官方 example 内嵌在 gpui crate，自动继承；独立成 crate 后要显式声明）。
[features]
test-support = ["gpui/test-support"]

[dev-dependencies]
rand = "0.9"
futures = "0.3"

# Android：NativeActivity 加载 cdylib .so；gpui_android 提供 JNI/平台桥接，
# android-activity 必须开 native-activity，android_logger 提供日志后端。
[target.'cfg(target_os = "android")'.dependencies]
gpui-android = { path = "../../packages/gpui-android" }
android-activity = { version = "0.6", features = ["native-activity"] }
android_logger = "0.15"
