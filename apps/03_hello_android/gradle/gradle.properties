# ── 本例子的 Android 配置（Tauri 风格：只改这里，不碰 Kotlin/Gradle）────────
# 共享构建逻辑见仓库根 gradle/android-app.gradle.kts，由本文件的变量驱动。

# 应用 ID / namespace（决定装到手机上的包名）
appId=dev.gpui.learn.hello_android
# 启动器显示名
appName=GPUI Learn · Hello Android
# cargo cdylib 的 [lib] name → 编出 lib<rustLibName>.so
rustLibName=hello_android
# workspace 里的 cargo 包名，用于 `cargo ndk -p <cargoPackage>`
cargoPackage=hello_android_03
# 目标 ABI（默认 arm64-v8a）
rustTarget=arm64-v8a

# ── 以下为 Gradle / Android 通用配置 ────────────────────────────────────────
android.useAndroidX=true
android.nonTransitiveRClass=true
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
