[package]
name = "grid_layout_05"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false
description = "05_grid_layout —— GPUI 响应式网格布局（Holy Grail）+ container_query（桌面端）"

# 桌面二进制例子。GPUI 来自本仓库统一锁定的 zed 82aef443（见根 Cargo.toml 的
# [patch.crates-io]），通过 workspace 依赖引入，版本随根清单一处管理。
[dependencies]
gpui = { workspace = true }

# 关键：gpui_platform 的 default-features 是空的（default = []），必须显式开启
# 窗口后端，否则 open_window 会"成功"但屏幕不出现窗口。这是官方 gpui example
# 的写法（见 zed 仓库 crates/gpui/Cargo.toml）。
[target.'cfg(any(target_os = "linux", target_os = "freebsd"))'.dependencies]
gpui_platform = { workspace = true, features = ["font-kit", "wayland", "x11"] }

[target.'cfg(not(any(target_os = "linux", target_os = "freebsd", target_family = "wasm")))'.dependencies]
gpui_platform = { workspace = true }

[target.'cfg(target_family = "wasm")'.dependencies]
gpui_platform = { workspace = true }
wasm-bindgen = "0.2.120"
