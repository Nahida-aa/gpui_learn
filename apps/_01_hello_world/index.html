<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=0"
    />
    <title>GPUI Web: hello_world_01</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: #222;
      }
      /* GPUI 在 wasm 下会自己创建 <canvas> 并 append 到 body，
         这里只需让它铺满整个视口。 */
      canvas {
        display: block;
        width: 100%;
        height: 100%;
        touch-action: none;
        outline: none;
        -webkit-user-select: none;
        user-select: none;
      }
    </style>
  </head>
  <body>
    <script type="module">
      // 由 wasm-bindgen --target web 生成的 JS 绑定导出一个 init 函数。
      // 浏览器加载这个模块即启动 GPUI（对应 main.rs 里的 #[wasm_bindgen(start)]）。
      import init from "./hello_world_01.js";
      init().catch((e) => {
        console.error("GPUI Web 启动失败:", e);
        document.body.innerHTML = '<pre style="color:#f88;padding:1em">' + e + "</pre>";
      });
    </script>
  </body>
</html>
