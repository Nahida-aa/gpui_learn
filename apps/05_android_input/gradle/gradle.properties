# ── 本例子的 Android 配置（Tauri 风格：只改这里，不碰 Gradle/Kotlin）────────
# 共享构建逻辑见仓库根 gradle/android-app.gradle，由本文件的变量驱动。

# 应用 ID / namespace（与 03 不同，这样两台例子能共存于同一台手机）
appId=dev.gpui.learn.input_05
# 启动器显示名
appName=GPUI Learn · Input
# cargo cdylib 的 [lib] name → 编出 lib<input_05>.so
rustLibName=input_05
# workspace 里的 cargo 包名，用于 `cargo ndk -p <cargoPackage>`
cargoPackage=input_05_android
# 目标 ABI（默认 arm64-v8a）
rustTarget=arm64-v8a

# ── 以下为 Gradle / Android 通用配置 ────────────────────────────────────────
android.useAndroidX=true
android.nonTransitiveRClass=true
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
