[package]
name = "input_05_android"
version = "0.1.2"
edition = "2024"
license = "Apache-2.0"
publish = false
description = "05_android_input —— 用 gpui-android 后端在手机上跑文本输入（IME/选区/剪贴板），移植自 04_input"

# Android 的 NativeActivity 加载的是 .so（cdylib）。非 android 编译时几乎是空壳。
[lib]
name = "input_05"
crate-type = ["cdylib"]

[dependencies]
gpui = { workspace = true }
gpui-android = { path = "../../crates/gpui-android" }
unicode-segmentation = "1.11"

[target.'cfg(target_os = "android")'.dependencies]
# 版本与 crates/gpui-android/Cargo.toml 保持一致（android-activity 必须开 native-activity）。
android-activity = { version = "0.6", features = ["native-activity"] }
android_logger = "0.15"
log = { version = "0.4", features = ["kv_unstable_serde", "serde"] }
