[package]
name = "ug_05_editor"
version.workspace = true
license.workspace = true
edition.workspace = true
publish.workspace = true
description = "ug_05_editor —— aa_ui_zed 的多行编辑器演示"

[dependencies]
gpui = { workspace = true }
aa_ui_zed.workspace = true
# 编辑器内核已独立成包(demo 直接用内核的多行 Editor)
editor.workspace = true
aa_theme_gpui.workspace = true
tracing-subscriber.workspace = true

[target.'cfg(any(target_os = "linux", target_os = "freebsd"))'.dependencies]
gpui_platform = { workspace = true, features = ["font-kit", "wayland", "x11"] }

[target.'cfg(not(any(target_os = "linux", target_os = "freebsd", target_family = "wasm")))'.dependencies]
gpui_platform = { workspace = true }

[target.'cfg(target_family = "wasm")'.dependencies]
gpui_platform = { workspace = true }
wasm-bindgen.workspace = true
