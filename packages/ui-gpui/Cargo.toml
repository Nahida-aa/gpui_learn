[package]
name = "ui-gpui"
version = "0.1.0"
edition.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
gpui.workspace = true
gpui_macros.workspace = true
# 内嵌图标资源（icons/*.svg），运行时经 app 的 AssetSource 按路径加载。
rust-embed.workspace = true
# assets.rs 的 AssetSource 实现用 anyhow 做错误上下文。
anyhow.workspace = true

# 交互/状态逻辑测试（SliderState 的 update_value_by_position 等）需要 gpui 的
# test-support 特性与 #[gpui::test] 宏。feature 开关供 `cargo test -F test-support`。
[features]
test-support = ["gpui/test-support"]

[dev-dependencies]
rand = "0.9"
futures = "0.3"
