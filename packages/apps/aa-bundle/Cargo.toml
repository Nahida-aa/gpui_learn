[package]
name = "aa-bundle"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "aa-bundle —— 打包工具（库 + 二进制）：身份解析 / 各平台安装包生成"

# 库侧放**可复用**的打包基础设施（身份解析、文件写入等）；二进制只做 CLI 壳。
# aa-gpui-cli 等工具依赖库侧，不重复实现。
# 包名 kebab → 库名自动规范化为 `aa_bundle`。
[lib]
path = "src/lib.rs"

[[bin]]
name = "aa-bundle"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
clap = { version = "4", features = ["derive"] }
serde.workspace = true
serde_json.workspace = true
toml.workspace = true

[lints]
workspace = true
