[package]
name = "aa-gpui-cli"
version.workspace = true
edition.workspace = true
license = "Apache-2.0"
publish = false
description = "aa-gpui-cli —— GPUI 工程的脚手架工具（android init 等），配置驱动生成 Android 工程"

# 这是个「开发工具」crate，不进任何运行时依赖图。它复用本仓库锁定的 GPUI
# 仅是为了读 Cargo.toml 时的版本一致性，实际不依赖 GPUI 运行时。
[[bin]]
name = "aa-gpui-cli"
path = "src/main.rs"

[dependencies]
# 打包基础设施（身份解析 / 文件写入）来自 aa-bundle 库侧，不重复实现。
# 单一事实源在 aa-stack（2026-10 迁出），与 theme/icons 等同款本地路径依赖。
aa-bundle = { path = "/home/aa/repos/lib_ls/aa-stack/packages/apps/aa-bundle" }
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
toml.workspace = true
