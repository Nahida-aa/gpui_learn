[package]
name = "aa_gpui_android"
version = "0.9.3"
edition.workspace = true
description = "Android platform backend for GPUI (vendored into gpui_learn, pinned to zed d88f6821)"
license = "Apache-2.0"
publish = false

[lib]
crate-type = ["rlib"]

[features]
default = []
autoeq = []
camera = []
deeplink = []
gpu-2d = []
gpu-3d = []
media_session = []
reqwest = []
showcase = []
spinorama = []
tokio = []
urlencoding = []

# gpui 走 `workspace = true` 继承根 [workspace.dependencies] 的
# `gpui = { version = "0.2.2", default-features = false }`，再由根
# [patch.crates-io] 统一指向 zed 的某个 rev。
#
# 不可写成 git 直连（`{ git = ..., rev = ... }`）—— 那样绕过 crates.io，
# 根的 patch 对它不生效，本包就会与仓库其余部分用**两个不同的 gpui**，
# 同一依赖图里出现两份 gpui 时会报 E0463（类型不互通）。
[dependencies]
accesskit = "0.24.0"
anyhow.workspace = true
futures.workspace = true
gpui.workspace = true
gpui_wgpu.workspace = true
log.workspace = true
parking_lot.workspace = true
raw-window-handle = "0.6"
smallvec.workspace = true
serde_json.workspace = true

[target.'cfg(target_os = "android")'.dependencies]
android-activity = { version = "0.6", features = ["native-activity"] }
android_logger.workspace = true
jni = "0.22"
libc.workspace = true
ndk = { version = "0.9", features = ["nativewindow"] }
ndk-context = "0.1"
ndk-sys = "0.6"
rustc-hash = "2"
uuid.workspace = true
