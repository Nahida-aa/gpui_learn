[package]
name = "theme-settings"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
# 单向依赖 aa-gpui-kit-theme：本包知道「主题 JSON 长什么样」并把它装进主题
# 注册表；theme 包反过来完全不知道 JSON 存在——与 zed 的
# `crates/theme` ← `crates/theme_settings` 同一方向。
aa-gpui-kit-theme.workspace = true
gpui.workspace = true
tracing.workspace = true

# 主题扩展 JSON 的解析。
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# init.rs 的兜底链路测试用 #[gpui::test]（需要 gpui 的 test-support）。
# 与 ui-gpui 同款：feature 开关供 `cargo test -F test-support`。
[features]
test-support = ["gpui/test-support"]
