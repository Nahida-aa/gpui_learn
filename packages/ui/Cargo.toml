[package]
name = "aa_gpui_kit_ui"
version = "0.1.0"
edition.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
gpui.workspace = true
gpui_macros.workspace = true
tracing.workspace = true
# 复用工作区共享的 assets crate（packages/assets）：图标等资源内嵌在仓库根
# assets/ 下，由该 crate 的 RustEmbed 统一加载。本包不自带资源。
# 位置在 workspace 根的 [workspace.dependencies] 统一声明，这里继承。
aa_gpui_kit_assets.workspace = true

# 主题系统（packages/theme）：语义色/语法色/注册表。本包只是它的调用方，
# 组件通过 `aa_gpui_kit_theme::ActiveTheme` 取色，因此这里不加 module 别名。
# 编辑器内核（packages/editor）：InputState/Textarea 是它的薄 facade。
editor.workspace = true
aa_gpui_kit_theme.workspace = true

# 宏包：derive_dynamic_spacing!（styles/spacing 的密度间距枚举）。
# 组件示例库基建（packages/component）：Component trait / 注册 / 示例。
aa_gpui_kit_component.workspace = true

aa_gpui_kit_ui_macros.workspace = true

# 输入框按「字素簇」(grapheme) 移动光标，避免切断 emoji / 组合字符。
unicode-segmentation = "1"
# LabelLike 等组件的小向量（与 gpui 内部同源版本线）。
smallvec = "1"

# KeyBinding：itertools::intersperse（按键之间的分隔符）与 Itertools::join。
itertools.workspace = true

# 主题加载器：解析 zed 主题扩展 JSON（v0.2.0 扁平格式）进 ThemeRegistry。
serde = { version = "1", features = ["derive"] }
serde_json = "1"

documented.workspace = true

# 交互/状态逻辑测试（SliderState 的 update_value_by_position 等）需要 gpui 的
# test-support 特性与 #[gpui::test] 宏。feature 开关供 `cargo test -F test-support`。
[features]
test-support = ["gpui/test-support"]

[dev-dependencies]
rand = "0.9"
futures = "0.3"
