[package]
name = "aa-gpui-kit-theme"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
# 主题本质是 gpui 的全局状态(`Global`)与颜色类型(`Hsla`/`GlobalColors`),
# 因此这个包不是纯数据包,必须依赖 gpui。物理上独立成 crate 的价值在
# 「主题系统与控件库解耦」:控件库只是它的一个调用方。
gpui.workspace = true
tracing.workspace = true

# 主题加载器:解析 zed 主题扩展 JSON(v0.2.0 扁平格式)进 ThemeRegistry。
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# 颜色解析(schema::try_parse_color):sRGB → HSL 转换。
# 版本与 zed crates/theme 对齐(0.7.5),default-features = false + std 避免
# 拖进它默认开启的色板/序列化等用不到的特性。
palette = { version = "0.7.5", default-features = false, features = ["std"] }
# try_parse_color 用 anyhow 返回带上下文的错误(与 zed 同款)。
anyhow.workspace = true

# font_family_cache 的读写锁:字体列表很贵(要问系统),缓存后并发读。
# 已在依赖树里(gpui 间接引入),加为直接依赖零成本。
parking_lot = "0.12"

# 主题的「部分覆盖」机制:`ThemeColors` / `StatusColors` 加 derive 后
# 得到 `XxxRefinement`(每字段 Option 化),主题 JSON 只写要覆盖的字段。
refineable.workspace = true

# 注册表(registry.rs):错误类型定义(`ThemeNotFoundError` 等)。
thiserror = "2"
# 图标主题的 id 生成(注册表装载图标主题时给每个主题一个唯一 id)。
uuid = { version = "1", features = ["v4"] }

# state.rs 的 SystemAppearance 等全局测试用 #[gpui::test]。
[features]
test-support = ["gpui/test-support"]
