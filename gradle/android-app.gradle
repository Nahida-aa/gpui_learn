// ============================================================================
// android-app.gradle —— 共享的 Android 应用构建模板（Tauri 风格，Groovy DSL）
// ============================================================================
//
// 这是「所有 gpui-android 例子」共用的 Gradle 构建逻辑。每个例子不再手写
// build.gradle，而是只写一份 gradle.properties 配置，再 apply 本模板：
//
//     // apps/XX/gradle/app/build.gradle.kts
//     apply(from = rootProject.file("../../../gradle/android-app.gradle"))
//
// 用 Groovy DSL（而非 .kts）是因为：被 `apply from=` 的脚本在 Kotlin DSL 下
// 拿不到 android 插件的类型安全访问器；Groovy 的动态访问器没有这个限制，
// 从而做到「一份模板、多个例子零脚本复用」。这与 Tauri 用 tauri.conf.json
// 生成 Android 工程是同一个哲学：配置驱动，模板生成。
//
// 本模板从 gradle.properties 读取：
//   appId / appName / rustLibName / cargoPackage / rustTarget
//   （minSdk / targetSdk / compileSdk 有默认值，可在 gradle.properties 覆盖）
// ============================================================================

// 被 `apply from=` 的脚本不能用 plugins {} 块，改用 apply plugin:。
// AGP 版本在根 build.gradle.kts 用 `apply false` 声明，这里直接复用。
apply plugin: 'com.android.application'

// ── 从 gradle.properties 读配置 ────────────────────────────────────────────
def appId = providers.gradleProperty('appId').get()
def appName = providers.gradleProperty('appName').get()
def rustLibName = providers.gradleProperty('rustLibName').get()
def cargoPackage = providers.gradleProperty('cargoPackage').get()
def rustTarget = providers.gradleProperty('rustTarget').getOrElse('arm64-v8a')
def minSdkVer = providers.gradleProperty('minSdk').getOrElse('26') as int
def targetSdkVer = providers.gradleProperty('targetSdk').getOrElse('35') as int
def compileSdkVer = providers.gradleProperty('compileSdk').getOrElse('35') as int

// cargo ndk 的 -o 目录会**自动追加 ABI 子目录**，所以这里给 jniLibs 根即可，
// 最终产物落在 src/main/jniLibs/<rustTarget>/lib<rustLibName>.so（Gradle 期望位置）。
def jniLibsDir = layout.projectDirectory.dir('src/main/jniLibs')
def cargoProfile = providers.gradleProperty('release').isPresent() ? 'release' : 'debug'

// ── Rust 交叉编译任务：cargo ndk 编出 .so ───────────────────────────────────
tasks.register('cargoBuild', Exec) {
    workingDir = projectDir.parentFile.parentFile.parentFile.parentFile // 仓库根（含 Cargo.toml workspace）
    def args = [
        'cargo', 'ndk',
        '-t', rustTarget,
        '-P', '26', // 必须 ≥ 24，否则 NDK 链接找不到 libnativewindow.so
        '-o', jniLibsDir.asFile.absolutePath,
        'build',
        '-p', cargoPackage,
    ]
    if (cargoProfile == 'release') {
        args += '--release'
    }
    commandLine(args)
    outputs.dir(jniLibsDir)
}

// 让 :app:preBuild 依赖 Rust 编译，保证打 apk 前 .so 已就位。
tasks.named('preBuild') { dependsOn('cargoBuild') }

android {
    namespace appId
    compileSdk compileSdkVer

    defaultConfig {
        applicationId appId
        minSdk minSdkVer
        targetSdk targetSdkVer
        versionCode 1
        versionName '0.1.0'

        ndk {
            abiFilters += [rustTarget]
        }

        // 填进 AndroidManifest 的 android.app.lib_name（NativeActivity 用它找 .so）。
        manifestPlaceholders['nativeLibraryName'] = rustLibName
        // 把 appName 注入资源，AndroidManifest 用 @string/app_name 引用即可，
        // 例子无需手写 res/values/strings.xml。
        resValue('string', 'app_name', appName)
    }

    buildTypes {
        debug {
            debuggable true
            jniDebuggable true
        }
        release {
            minifyEnabled false
        }
    }

    sourceSets {
        main {
            jniLibs.srcDirs('src/main/jniLibs')
            // 复用 vendored gpui-android 提供的 GpuiActivity.java（NativeActivity 子类 +
            // 软键盘 InputConnection + 无障碍桥接）。不复制，直接引用源码目录。
            java.srcDir('../../../../crates/gpui-android/android/src/main/java')
            // 共享的全屏主题 GpuiTheme（仓库根 gradle/android-res），各例子无需手写 styles.xml。
            res.srcDir('../../../../gradle/android-res')
        }
    }

    packaging {
        jniLibs {
            keepDebugSymbols += ["*/$rustTarget/lib${rustLibName}.so"]
        }
    }
}
