# gpui_learn —— 一个用来学 GPUI 的 Rust monorepo 教学仓库
#
# 这个文件是「工作区（workspace）」的根清单。它本身不编译任何代码，
# 只负责两件事：
#   1. 声明哪些子包（crate）属于这个工作区；
#   2. 把「依赖版本 / 公共配置」集中起来，让所有子包共享。
#
# 想深入理解 workspace，读 crates/gpui_learn_common/README.md 和
# apps/hello_window/README.md，里面用文档注释逐条讲了下面的每个字段。

[workspace]
# resolver = "3" 是 Rust 2024 edition 引入的特性解析器。
# 它决定了「同一个依赖的不同版本如何合并」「dev-dependencies 会不会泄漏到
# 正常构建」等行为。edition = "2024" 会自动启用 resolver 3，但这里显式写出，
# 是为了让读这个文件的人一眼看到我们在用 2024 的工作区语义。
resolver = "3"

# members：工作区里「所有」成员。全部显式列出——避免通配符 `packages/*`
# 扫到 aa_gpui_kit/ 父目录的 src/ 等非 crate 子目录时报错。
# 新增 crate 时记得在这里加一行。
members = [
    "apps/*",
    # 平铺 crate（packages/<name>/Cargo.toml）
    "packages/aa_cloud_llm_client",
    "packages/aa_language_model_core",
    "packages/aa_settings_json",
    "packages/aa_settings_macros",
    "packages/assets",
    "packages/base",
    "packages/clock",
    "packages/component",
    "packages/editor",
    "packages/gpui-cli",
    "packages/aa_gpui/gpui_android",
    "packages/aa_gpui/gpui_fuzzy",
    "packages/grammars",
    "packages/icons",
    "packages/language_core",
    "packages/theme",
    "packages/theme-settings",
    "packages/ui",
    "packages/ui_input",
    "packages/ui_macros",
    "packages/zed/zed_cloud_llm_client",
    "packages/zed/zed_http_client",
    # aa_gpui_kit 子 crate（packages/aa_gpui_kit/<name>/Cargo.toml）
    "packages/aa_gpui_kit/settings_content",
    # aa 子 crate（packages/aa/<name>/Cargo.toml）
    "packages/aa/util",
    "packages/aa/util_macros",
    # zed 子 crate（packages/zed/<name>/Cargo.toml）
    "packages/zed/zed_migrator", "packages/zed/zed_release_channel", "packages/aa/aa_release_channel", "packages/zed/zed_settings", "packages/zed/zed_paths", "packages/aa/ztracing_macro", "packages/aa/zlog", "packages/zed/telemetry", "packages/zed/telemetry/telemetry_events", "packages/aa_gpui_kit/aa_gpui_kit_fs", "packages/zed/zed_proto", "packages/aa_gpui_kit/aa_gpui_kit_askpass", "packages/aa_gpui_kit/aa_gpui_kit_git", "packages/aa/ztracing", "packages/zed/zed_paths", "packages/aa/ztracing_macro", "packages/aa/zlog", "packages/zed/telemetry", "packages/zed/telemetry/telemetry_events", "packages/aa_gpui_kit/aa_gpui_kit_fs", "packages/zed/zed_proto", "packages/aa_gpui_kit/aa_gpui_kit_askpass", "packages/aa_gpui_kit/aa_gpui_kit_git", "packages/aa/ztracing", "packages/aa_gpui_kit/aa_gpui_kit_rope", "packages/aa_gpui_kit/aa_gpui_kit_text",
]

# default-members：当你只敲 `cargo build` / `cargo run`（不带 -p）时，
# cargo 实际去构建哪些成员。这里只放 `packages/gpui-cli`（开发工具）：
#   - `apps/` 现在有 48 个示例包，全量默认构建一次要很久；
#   - gpui-cli 不依赖 gpui 运行时（仅 clap/serde/toml），裸 `cargo build` 秒完；
#   - 它是 CLI 入口，裸 `cargo run` 有明确语义（需带子命令，如
#     `cargo run -- android init`）。
#
# 注意：`default-members` 同时决定裸 `cargo test` 的范围——收窄后
# `cargo test` 只测 gpui-cli。aa_gpui_kit_ui 的测试请用 `just test`，
# 全量用 `cargo test --workspace`；全量构建用 `cargo build --workspace`。
default-members = [
    "packages/gpui-cli",
]

# [workspace.package] 里写的字段会被子包用 `version.workspace = true` 继承。
# 这样全仓库版本号、edition、license 统一改一处即可。
[workspace.package]
version = "0.1.0"
edition = "2024"
# **默认 GPL-3.0-or-later**（2026-09-22 变更，与 zed 同款的两套许可证）：
# 本仓库大量文件是照搬 / 改写自 zed（crates/ui、component、theme_settings、
# settings_json、fuzzy …），上游是 GPL-3.0-or-later，承载它们就必须同许可。
# 只有**确认零 zed 代码**的包才在各自的 Cargo.toml 里覆盖成 Apache-2.0：
#   - packages/gpui-cli（构建/开发工具）
#   - packages/aa_gpui/gpui_android（Android 平台适配，只依赖 zed 的 Apache-2.0 侧 gpui）
# 新增包时：含 zed 来源代码 → 继承默认（别写 license 字段）；纯自研 → 显式写
# `license = "Apache-2.0"`。许可证文本见根目录 LICENSE-GPL / LICENSE-APACHE。
license = "GPL-3.0-or-later"
publish = false   # 教学仓库，不发布到 crates.io

# [workspace.dependencies] 是 monorepo 共享依赖的核心机制。
# 子包里写 `gpui = { workspace = true }` 就能拿到这里统一定义的源与版本，
# 避免每个例子各写一遍 git 源导致版本漂移。
[workspace.dependencies]
aa_cloud_llm_client = { path = "packages/aa_cloud_llm_client" }
async-compression = { version = "0.4", features = ["bzip2", "gzip", "futures-io"] }
async-lock = "3.4.2"
async-tar = { git = "https://github.com/zed-industries/async-tar", rev = "bd3ad6f89df9a9da7a8535958756d6bf465936a0" }

bytes = "1.0"
convert_case = "0.11.0"
derive_more = { version = "2.1.1", features = [
    "add",
    "add_assign",
    "deref",
    "deref_mut",
    "display",
    "from",
    "from_str",
    "mul",
    "mul_assign",
    "not",
] }
http = "1.1"
http-body = "1.0"

partial-json-fixer = "0.5.3"
pretty_assertions = { version = "1.3.0", features = ["unstable"] }
serde_path_to_error = "0.1"
semver = { version = "1.0", features = ["serde"] }
unindent = "0.2"
sha2 = "0.10"
serde_urlencoded = "0.7"

thiserror = "2.0.12"

# zed_http_client = { path = "packages/zed_http_client" }
# 注意这里的写法：子包声明的是「语义版本 0.2.2」（来自 crates.io），
# 真正的 git 源在下面的 [patch.crates-io] 里把 crates.io 上的 gpui 整体
# 替换成 zed 仓库的对应 commit。这样：
#   - 声明侧保持语义化、可读、可复现；
#   - git 源只出现在根清单一处，升级只改 [patch.crates-io] 的 rev。
# 为什么不直接在 workspace.dependencies 里写 git 源？因为 [patch.crates-io]
# 是 Rust 官方推荐的「覆盖依赖来源」机制，语义更清晰，也更容易演示给学习者。
#
# default-features = false：gpui 发布版默认会开 wayland/x11/font-kit，
# 我们让库（gpui_learn_common）按需启用，见 crates/gpui_learn_common/README.md。
gpui = { version = "0.2.2", default-features = false }
# gpui_macros 与 gpui 同版本线（crates.io 上是 0.2.2），写错版本会导致 resolve 失败。
gpui_macros = { version = "0.1.0" }
# gpui_platform 提供平台入口（application()），是发布版例子实际需要的 crate。
gpui_platform = { version = "0.1.0" }
gpui_web = { version = "0.1.0" }
# gpui_wgpu 是渲染后端（winit + wgpu），aa_gpui_android 需要它来建 EGL 上下文。
# 此前只在 [patch.crates-io] 里、没在这里声明，导致子包无法用 workspace = true 引用。
gpui_wgpu = { version = "0.1.0" }
gpui_util = { version = "0.1.0" }
# gpui_shared_string：arc<str> 包装，zed 没发布 crates.io，直接走 git。
gpui_shared_string = { git = "https://github.com/zed-industries/zed", rev = "afecd6d719aad92aecfa2860f49c4f2956708831", version = "=0.1.0" }

# 任何子包都可以用 `anyhow = { workspace = true }` 引用，版本由这里统一。
anyhow = "1.0"

# sum_tree：zed 的并发友好 B-tree（gpui 内部也在用，见 gpui/src/tab_stop.rs）。
# zed 未把它发布到 crates.io（publish = false），因此这里直接写 git 源；
# rev 与下方 [patch.crates-io] 的 gpui 保持一致，cargo 会把同一 rev 的仓库
# 去重成一次 clone，且 gpui 内部的 sum_tree 与我们引用的是同一个包实例。
sum_tree = { git = "https://github.com/zed-industries/zed", rev = "afecd6d719aad92aecfa2860f49c4f2956708831" }
# menu：zed 的通用 action 集合（`Cancel` / `SelectNext` / `SelectPrevious` …，
# publish = false 故走 git 源，rev 同上）。ui 的 ModalHeader / Navigable 挂
# 的就是这些 action —— 必须与 aacode 引用的是同一个 crate，否则同一个
# `SelectNext` 会分裂成两个类型（同 §13）。
menu = { git = "https://github.com/zed-industries/zed", rev = "afecd6d719aad92aecfa2860f49c4f2956708831" }
net = { git = "https://github.com/zed-industries/zed", rev = "afecd6d719aad92aecfa2860f49c4f2956708831" }
# refineable：zed 的「部分覆盖」机制（publish = false，故走 git 源）。
# 主题需要它——主题 JSON 只写想覆盖的字段，其余落回默认值；
# `#[derive(Refineable)]` 会生成 `XxxRefinement`（每字段 Option 化）+ `refine()`。
# rev 与 gpui 的 [patch.crates-io] 保持一致。
refineable = { git = "https://github.com/zed-industries/zed", rev = "afecd6d719aad92aecfa2860f49c4f2956708831" }
# fuzzy：zed 的**旧**包（自写匹配器，publish = false，故走 git 源）。
# aa_gpui_fuzzy 对齐的是 zed 的新包 fuzzy_nucleo，而 fuzzy_nucleo 正是依赖
# 这个旧包来拿 `CharBag`（见 zed crates/fuzzy_nucleo/Cargo.toml）。我们同样
# 只依赖它的 CharBag 并原样转出，避免「两个结构完全相同的 CharBag 类型」
# ——那是 f6838a7 之后 worktree（用旧 fuzzy）与 project（用 nucleo 侧）之间
# 必然出现的类型冲突。
fuzzy = { git = "https://github.com/zed-industries/zed", rev = "afecd6d719aad92aecfa2860f49c4f2956708831" }

# path：zed 的路径类型（RelPath / AbsPath / PathStyle）。**Apache-2.0**，
# 是 zed 仓库里少见的宽松许可 crate，所以引它不会把 GPL 传染进来。
# aa_gpui_fuzzy 用它做候选路径类型——对齐 zed crates/fuzzy_nucleo 的签名，
# 这样 `PathMatchCandidateSet::path_style()` 等处不会出现「两套 PathStyle」。
# rev 与 gpui 的 [patch.crates-io] 保持一致。
path = { git = "https://github.com/zed-industries/zed", rev = "afecd6d719aad92aecfa2860f49c4f2956708831" }
perf = { git = "https://github.com/zed-industries/zed", rev = "afecd6d719aad92aecfa2860f49c4f2956708831" }
zeta_prompt = { git = "https://github.com/zed-industries/zed", rev = "afecd6d719aad92aecfa2860f49c4f2956708831" }

# 调试/结构化日志(仓库约定见 AGENTS.md)
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
# gpui_util 的 debug_panic! 宏在 release 分支展开为 log::error!。
log = { version = "0.4", features = ["kv_unstable_serde", "serde"] }
zeroize = "1"

# 数字千分位格式化（DiffStat 的 `1,234` 行数显示，与 zed ui 同款）。
num-format = "0.4.4"
uuid = { version = "1.1.2", features = ["v4", "v5", "v7", "serde"] }

# 用 `~8.11` 而非 "8.11"：后者无上界（^8.11），rust-embed 对 impl/utils 的约束
# 又是 ^8.9，于是三者会各自漂到当前最新的 8.12.x。而 `compressed()` /
# `EmbeddedCompressedFile` 这套 API 只存在于 8.12、8.11 的 trait 里没有——
# 一旦某个下游（如 aacode，它给 rust-embed 开了 compression）把 impl 解析到 8.12
# 而 lib 停在 8.11，derive 展开就报：
#   E0407: method `compressed` is not a member of trait `rust_embed::RustEmbed`
#   E0425/E0422: cannot find type/struct `EmbeddedCompressedFile`
# 锁到 8.11.x 可保证本仓库与 aacode 的 rust-embed 三件套版本一致。
#
# features 也要与上游 zed（Cargo.toml L825）、aacode 三方一致，都开 compression：
# 本仓库的 packages/assets 经 aacode 的 [patch] 以 path 依赖被引入，而 aacode 侧
# 开了 compression；feature 在同一个编译单元内会被 cargo 合并（取并集），
# 但若本仓库单独构建时不开，两边的编译产物就会不一致（同一 crate 在两个
# workspace 链接到不同的 feature 组合）。
# 约束与 Zed 一致（Cargo.toml:825），同为 "8.11"（caret，<9.0）。
#
# 【重要】这条约束单独看是"洞"，靠提交的 Cargo.lock 填住 —— 与 Zed 的做法完全相同：
#
#   rust-embed 8.11.0 对 proc-macro 的约束是 rust-embed-impl = "8.9.0"（>=8.9, <9），
#   很松。所以一旦 impl 被解析到 8.12+（其 derive 会生成对 EmbeddedCompressedFile 的
#   引用，见 crates/util/src/embed.rs 的 __rust_embed），而 lib 仍停在 8.11.0
#   （该版本没有这个类型），就会错配：
#     error[E0425]: cannot find type `EmbeddedCompressedFile` in module `::util::__rust_embed`
#     error[E0422]: cannot find struct, variant or union type `EmbeddedCompressedFile`
#
# 三件套必须同版本。实测（rust-embed 对 impl 的约束）：
#   lib 8.11.0 → impl "8.9.0"   松，impl 可漂到 8.13  ← 唯一会错配的组合
#   lib 8.12.0 → impl "8.12.0"  下限对齐，不可能错配
#   lib 8.13.0 → impl "8.13.0"  同上
# EmbeddedCompressedFile 由 rust-embed-utils 定义，8.11 无、8.12 起有；
# 引用它的 derive 同理：impl 8.11 不引用、8.12 起引用。
#
# 因此：下游必须把 rust-embed / -impl / -utils 三者一起钉在 8.11.x。aacode 侧的做法是
#   cargo update -p rust-embed       --precise 8.11.0
#   cargo update -p rust-embed-impl  --precise 8.11.0
#   cargo update -p rust-embed-utils --precise 8.11.0
# 并提交 Cargo.lock。Zed 靠同样的机制（lock 已提交 + CI 一律 --locked，run_tests.yml:701），
# 它没有为这件事写任何文档，本注释是补在 gpui_learn 侧的。
rust-embed = { version = "8.11", features = ["include-exclude", "compression"] }
serde = { version = "1.0.221", features = ["derive", "rc"] }
serde_json = { version = "1.0.144", features = ["preserve_order", "raw_value"] }
strum = { version = "0.28", features = ["derive"] }
# JSON Schema（`schemars::JsonSchema`）：settings 包要把 ui 的枚举（如
# `scrollbars::ShowScrollbar`）直接放进 `#[derive(JsonSchema)]` 的设置项里，
# 版本必须与 aacode 一致（都是 1.x），否则两个 `JsonSchema` trait 会对不上。
schemars = { version = "1", features = ["derive"] }
# 模糊匹配（packages/aa_gpui/gpui_fuzzy）：字符串 / 路径的打分与高亮，对齐 zed
# crates/fuzzy_nucleo（底层用 crates.io 的 nucleo，MPL-2.0）。依赖 gpui 是因为
# 需要 BackgroundExecutor（并行分段 + 可取消）与 SharedString。
aa_gpui_fuzzy = { path = "packages/aa_gpui/gpui_fuzzy" }

# 图标名枚举（packages/icons，zed crates/icons 原样）。全仓库唯一的 IconName：
# base::Icon、ui、aacode 的 `icons` 别名用的都是它，靠 snake_case 序列化拼出
# assets/icons/ 下的 SVG 路径（`path()` + 双向测试也在这个包里）。
aa_icons = { path = "packages/icons" }

# 时钟（packages/clock）：逻辑时钟（Lamport / 版本向量）+ 可注入的系统时钟。
# **零 gpui 依赖**（对齐 zed crates/clock 的自研版，见 docs/zed/clock-analysis.md），
# 所以任何层都可以引用它而不会把 gpui 拖进依赖图。
aa_clock = { path = "packages/clock" }

# 工作区共享的资源 crate（packages/assets）：内嵌仓库根 assets/ 下的字体/图标等。
# 子包用 `assets.workspace = true` 引用，位置统一在此声明，避免各包散写相对路径。
aa_gpui_kit_assets = { path = "packages/assets" }

# 基础控件层（packages/base）：geometry / icon / slider。
# **zed 的 ui 里没有对应物** —— 这是我们自研的一层，`aa_gpui_kit_ui` 在它
# 之上对齐 zed，所以依赖方向是 ui → base（单向，base 不反向依赖 ui / theme）。
aa_gpui_base = { path = "packages/base" }

# 主题系统（packages/theme）：对齐 zed crates/theme 的精简版，含语义色、
# 语法色与主题注册表。独立成包是因为它不隶属控件库——aa_gpui_kit_ui 只是调用方，
# 因此 aa_gpui_kit_ui 也通过 `aa_gpui_kit_theme.workspace = true` 引用（不留 module 别名）。
aa_gpui_kit_theme = { path = "packages/theme" }
aa_gpui_kit_component = { path = "packages/component" }
# settings_content 源码里用 `use settings_macros::*` / `use settings_json::*` /
# `use language_model_core::*`，但 gpui_learn 里的包名加了 aa_ 前缀。
# 直接用 alias 让源码零改动，不再单独声明 aa_settings_* / aa_language_model_core。
settings_content = { package = "aa_gpui_kit_settings_content", path = "packages/aa_gpui_kit/settings_content" }
settings_macros = { package = "aa_settings_macros", path = "packages/aa_settings_macros" }
settings_json = { package = "aa_settings_json", path = "packages/aa_settings_json", default-features = false }
language_model_core = { package = "aa_language_model_core", path = "packages/aa_language_model_core" }
aa_release_channel = { path = "packages/aa/aa_release_channel" }
release_channel = { package = "aa_release_channel", path = "packages/aa/aa_release_channel" }
migrator = { package = "zed_migrator", path = "packages/zed/zed_migrator" }
json5 = "0.4"
ec4rs = { version = "1.2", features = ["allow-empty-values"] }
# paths / fs：zed crates，与同 rev 的 path / gpui 等保持一致
paths = { git = "https://github.com/zed-industries/zed", rev = "afecd6d719aad92aecfa2860f49c4f2956708831" }
fs = { git = "https://github.com/zed-industries/zed", rev = "afecd6d719aad92aecfa2860f49c4f2956708831" }
rope = { package = "aa_gpui_kit_rope", path = "packages/aa_gpui_kit/aa_gpui_kit_rope" }
text = { package = "aa_gpui_kit_text", path = "packages/aa_gpui_kit/aa_gpui_kit_text" }

# Android 平台后端（packages/aa_gpui/gpui_android）：NativeActivity + JNI 桥 + 输入法
# / 剪贴板 / 无障碍。vendored 自 zed 的 gpui-android，指向 zed 的 Apache-2.0 侧
# gpui（d88f6821，与根 [patch.crates-io] 同源）。
# 子包用 `aa_gpui_android.workspace = true` 引用，路径统一在此声明。
aa_gpui_android = { path = "packages/aa_gpui/gpui_android" }

# 主题的 JSON 装载与装配（packages/theme-settings）：知道主题扩展 JSON 的
# schema 并把它装进注册表。**单向依赖** aa_gpui_kit_theme——theme 包反过来
# 完全不知道 JSON 存在（对齐 zed 的 crates/theme ← crates/theme_settings）。
theme-settings = { path = "packages/theme-settings" }

# 编辑器内核（packages/editor）：自研 Rope 引擎 + 多行编辑器，从 aa_gpui_kit_ui
# 拆出（2026-09）。aa_gpui_kit_ui 的 InputState/Textarea 是它的薄 facade。
editor = { path = "packages/editor" }

# 控件库（packages/ui，原 ui-gpui）：slider/icon/button/divider/tooltip/
# context_menu 与 Label/KeyBinding。它**不依赖 editor**（2026-09 翻转，见
# docs/zed/ui-input-analysis.md）：输入类组件住在 aa_gpui_kit_ui_input。
aa_gpui_kit_ui = { path = "packages/ui" }

# 表单类输入组件（packages/ui_input）：需要编辑器内核的 UI 组件。
# 对齐 zed crates/ui_input：依赖 aa_gpui_kit_ui，编译期**不**依赖 editor，
# 对 editor 的依赖换成运行时注入（ErasedEditor + ERASED_EDITOR_FACTORY）。
aa_gpui_kit_ui_input = { path = "packages/ui_input" }

# 控件库的 proc-macro 宏包（derive_dynamic_spacing! 等）。
aa_gpui_kit_ui_macros = { path = "packages/ui_macros" }

# 宏包的实现依赖（zed workspace 同款三件套）。
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full"] }

# 组件示例库（packages/component）的依赖：inventory 做链接期静态注册。
smallvec = { version = "1.6", features = ["union", "const_new"] }
toml = "0.8"
# tree-sitter（官方 fork）：language_core 做语法高亮和解析。
tree-sitter = { git = "https://github.com/tree-sitter/tree-sitter", rev = "43623ec9bf0eaaf7113285c46e8a09018f181b18" }
tree-sitter-language = { git = "https://github.com/tree-sitter/tree-sitter", rev = "43623ec9bf0eaaf7113285c46e8a09018f181b18" }
tree-sitter-bash = "0.25.1"
tree-sitter-c = "0.24.1"
tree-sitter-cpp = { git = "https://github.com/tree-sitter/tree-sitter-cpp", rev = "5cb9b693cfd7bfacab1d9ff4acac1a4150700609" }
tree-sitter-css = "0.23"
tree-sitter-diff = "0.1.0"
tree-sitter-gitcommit = { git = "https://github.com/zed-industries/tree-sitter-git-commit", rev = "88309716a69dd13ab83443721ba6e0b491d37ee9" }
tree-sitter-go = "0.25"
tree-sitter-go-mod = { git = "https://github.com/camdencheek/tree-sitter-go-mod", rev = "2e886870578eeba1927a2dc4bd2e2b3f598c5f9a", package = "tree-sitter-gomod" }
tree-sitter-gowork = { git = "https://github.com/zed-industries/tree-sitter-go-work", rev = "acb0617bf7f4fda02c6217676cc64acb89536dc7" }
tree-sitter-jsdoc = "0.23"
tree-sitter-json = "0.24"
tree-sitter-md = { git = "https://github.com/zed-industries/tree-sitter-markdown", rev = "b596e737286780d7bfa9fcddceaeeb754574b352" }
tree-sitter-python = "0.25"
tree-sitter-regex = "0.24"
tree-sitter-rust = "0.24.2"
tree-sitter-typescript = { git = "https://github.com/zed-industries/tree-sitter-typescript", rev = "e2c53597d6a5d9cf7bbe8dccde576fe1e46c5899" }
tree-sitter-yaml = { git = "https://github.com/zed-industries/tree-sitter-yaml", rev = "baff0b51c64ef6a1fb1f8390f3ad6015b83ec13a" }
grammars = { package = "aa_gpui_kit_grammars", path = "packages/grammars" }
# KeyBinding 用 itertools::intersperse / Itertools::join 拼按键提示。
# 版本与 zed workspace 对齐（0.14 线）。
itertools = "0.14"
inventory = "0.3"
parking_lot = "0.12"
bitflags = "2.6.0"
lru = "0.16"
# 注意：`strum` 在上方 [workspace.dependencies] 已声明（0.28），这里不能重复。
documented = "0.10"
syntax_theme = { git = "https://github.com/zed-industries/zed", rev = "afecd6d719aad92aecfa2860f49c4f2956708831" }

# ---- util / util_macros (aa_gpui_kit_util*) 依赖 ----
# collections：zed 并发友好集合（publish=false，走 git），rev 与 gpui/path/perf 一致。
collections = { git = "https://github.com/zed-industries/zed", rev = "afecd6d719aad92aecfa2860f49c4f2956708831", version = "=0.1.0" }
http_client = { git = "https://github.com/zed-industries/zed", rev = "afecd6d719aad92aecfa2860f49c4f2956708831", version = "=0.1.0" }
streaming-iterator = "0.1"
indoc = "2"
async_zip = { version = "0.0.18", features = ["deflate", "deflate64"] }
futures = "0.3"
postage = { version = "0.5", features = ["futures-traits"] }
const_format = "0.2"
ignore = "0.4"
async-channel = "2"
chrono = { version = "0.4", features = ["clock"] }
async-trait = "0.1"
async-std = { version = "1.12", features = ["unstable"] }
slotmap = "1.0.6"
dunce = "1.0"
windows = "0.58"

# 内部 alias：依赖方用简写，实际包名不同
git = { package = "aa_gpui_kit_git", path = "packages/aa_gpui_kit/aa_gpui_kit_git" }
askpass = { package = "aa_gpui_kit_askpass", path = "packages/aa_gpui_kit/aa_gpui_kit_askpass" }
clock = { package = "aa_clock", path = "packages/clock" }
proto = { package = "zed_proto", path = "packages/zed/zed_proto" }
telemetry = { path = "packages/zed/telemetry" }
telemetry_events = { path = "packages/zed/telemetry/telemetry_events" }
zlog = { path = "packages/aa/zlog" }
ztracing = { path = "packages/aa/ztracing" }
ztracing_macro = { path = "packages/aa/ztracing_macro" }
futures-lite = "2"
shlex = "1.3.0"
which = "8"
regex = "1"
rayon = "1.8"
tempfile = "3"
criterion = { version = "0.5", features = ["html_reports"] }
ctor = "1.0.12"
unicode-segmentation = "1.10"
time = { version = "0.3", features = ["macros", "parsing", "formatting", "local-offset"] }
heapless = "0.9.2"
globset = "0.4"
dirs = "6.0"
url = "2.2"
percent-encoding = "2.3.2"
unicase = "2.6"
serde_json_lenient = { version = "0.2", features = ["preserve_order", "raw_value"] }
smol = "2.0"
async-fs = "2.1"
walkdir = "2.5"
libc = "0.2"
nix = "0.30"
rand = "0.9"
take-until = "0.2.0"
mach2 = "0.5"

util_macros = { path = "packages/aa/util_macros" }
util = { package = "aa_util", path = "packages/aa/util" }
language_core = { package = "aa_gpui_kit_language_core", path = "packages/language_core" }
rustix = { version = "1.1", features = ["fs"] }
prost = "0.14"
prost-build = "0.14"
protox = "0.9"
urlencoding = "2.1.2"
js-sys = "0.3"
wasm-bindgen = "0.2"

# [patch.crates-io]：把 crates.io 上的包「替换」成我们指定的源。
# 这是 Rust 官方的依赖覆盖机制——只要版本号匹配（这里都是 0.2.2），
# cargo 就会用 git 源里的版本替掉 crates.io 的版本，并写进 Cargo.lock。
# 这样我们既拿到了 crates.io 发布版的干净依赖图，又用上了 zed 仓库的
# 最新代码（含尚未发布到 crates.io 的特性，如 gpui_web 的 HTML/WASM 编译）。
[patch.crates-io]
# version = "=0.2.2" 精确指定：zed 仓库在该 rev 的 git 源里同时存在 0.0.0（开发版）
# 和历史上的 0.2.2 tag，cargo 要求显式锁定到我们要替换的那一个。
gpui = { git = "https://github.com/zed-industries/zed", rev = "afecd6d719aad92aecfa2860f49c4f2956708831", version = "=0.2.2" }
gpui_macros = { git = "https://github.com/zed-industries/zed", rev = "afecd6d719aad92aecfa2860f49c4f2956708831", version = "=0.1.0" }
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "afecd6d719aad92aecfa2860f49c4f2956708831", version = "=0.1.0" }
gpui_wgpu = { git = "https://github.com/zed-industries/zed", rev = "afecd6d719aad92aecfa2860f49c4f2956708831", version = "=0.1.0" }
gpui_util = { git = "https://github.com/zed-industries/zed", rev = "afecd6d719aad92aecfa2860f49c4f2956708831", version = "=0.1.0" }
# Unify `tree_sitter_language::LanguageFn` between crates.io grammar crates
# (tree-sitter-json 0.24 pulls crates.io tree-sitter-language 0.1.5) and our
# git rev tree-sitter (43623ec → tree-sitter-language 0.1.8). Two instances
# of LanguageFn would make `tree_sitter_json::LANGUAGE.into()` fail.
tree-sitter-language = { git = "https://github.com/tree-sitter/tree-sitter", rev = "43623ec9bf0eaaf7113285c46e8a09018f181b18" }
# [workspace.lints]：统一的 lint 配置，供子包用 `lints.workspace = true` 继承
# （如 packages/assets）。这里保持宽松，避免给教学仓库引入额外编译告警噪音。
[workspace.lints.rust]
# 允许 #[cfg(...)] 属性中出现未识别的配置条件
unexpected_cfgs = { level = "allow" }
